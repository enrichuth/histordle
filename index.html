.game-wrap { position: relative; width: 100%; max-width: 100%; margin-left: 160px; }
.monkey-wrap {
  position: absolute;
  left: -220px; top: 50%;
  transform: translateY(-45%);
  display: flex; flex-direction: column-reverse; align-items: center;
  z-index: 10; width: 310px;
  pointer-events: none;
}
.monkey-img {
  width: 400px; height: 400px;
  object-fit: contain;
  filter: drop-shadow(3px 5px 12px rgba(44,26,8,0.22));
  transition: opacity 0.3s;
}
.monkey-img.bounce { animation: mBounce 0.45s ease; }
.monkey-img.shake  { animation: mShake  0.4s ease; }
@keyframes mBounce {
  0%   { transform: translateY(0) rotate(0deg); }
  35%  { transform: translateY(-16px) rotate(-4deg); }
  70%  { transform: translateY(-6px) rotate(2deg); }
  100% { transform: translateY(0) rotate(0deg); }
}
@keyframes mShake {
  0%,100% { transform: translateX(0); }
  25%     { transform: translateX(-8px) rotate(-3deg); }
  75%     { transform: translateX(8px)  rotate(3deg); }
}
.bubble {
  background: #FFFDF5;
  border: 1.5px solid var(--parchment-shadow);
  border-radius: 14px;
  padding: 7px 11px;
  font-family: var(--fh);
  font-size: 14px;
  color: var(--ink-light);
  text-align: center;
  margin-bottom: 10px;
  margin-top: 0;
  width: 240px;
  line-height: 1.3;
  box-shadow: 2px 2px 0 rgba(44,26,8,0.12);
}
.past-btn {
  position: absolute;
  right: -36px; top: 60px;
  writing-mode: vertical-rl;
  background: var(--parchment-dark);
  border: 1.5px solid var(--parchment-shadow);
  border-left: none;
  border-radius: 0 6px 6px 0;
  padding: 12px 7px;
  font-family: var(--fh);
  font-size: 14px; font-weight: 700;
  color: var(--ink-light);
  cursor: pointer;
  box-shadow: 3px 2px 0 rgba(44,26,8,0.12);
  letter-spacing: 1px;
}
.past-btn:hover { background: var(--amber-bg); }
/* SCROLL */
.scroll {
  position: relative;
  background: var(--scroll-bg);
  border: 2px solid var(--ink-faint);
  border-radius: 8px;
  box-shadow: 3px 4px 0 rgba(44,26,8,0.14), 6px 8px 0 rgba(44,26,8,0.06);
}
.scroll::before {
  content: "";
  display: block; height: 26px;
  background: linear-gradient(180deg, var(--parchment-dark) 0%, var(--scroll-bg) 100%);
  border-bottom: 1.5px solid var(--parchment-shadow);
  border-radius: 8px 8px 0 0;
}
.scroll::after {
  content: "";
  display: block; height: 26px;
  background: linear-gradient(0deg, var(--parchment-dark) 0%, var(--scroll-bg) 100%);
  border-top: 1.5px solid var(--parchment-shadow);
  border-radius: 0 0 8px 8px;
}
.scroll-inner { padding: 0.75rem 1.25rem; }
.header {
  display: flex; align-items: baseline; gap: 10px;
  margin-bottom: 0.75rem; padding-bottom: 0.5rem;
  border-bottom: 1.5px solid var(--parchment-shadow);
}
.logo { font-family: var(--fh); font-size: 42px; font-weight: 400; color: var(--ink); letter-spacing: 2px; }
.byline { font-family: var(--fh); font-size: 14px; color: var(--ink-faint); }
.period-tag { margin-left: auto; font-family: var(--fh); font-size: 13px; color: var(--ink-faint); font-style: italic; }
.hint-label { font-family: var(--fh); font-size: 17px; font-weight: 400; color: var(--amber); margin-bottom: 6px; letter-spacing: 0.5px; }
.hint-line {
  display: flex; align-items: baseline; gap: 8px;
  padding: 7px 0; border-bottom: 1px solid var(--parchment-shadow); min-height: 36px;
}
.hint-line:last-child { border-bottom: none; }
.hint-num { font-family: var(--fh); font-size: 16px; color: var(--ink-faint); flex-shrink: 0; width: 20px; }
.hint-text { font-family: var(--fh); font-size: 18px; color: var(--ink); line-height: 1.5; }
.hint-text.active { font-weight: 400; }
.hint-text.empty { color: var(--parchment-shadow); }
.divider {
  height: 1.5px;
  background: linear-gradient(90deg, transparent, var(--parchment-shadow) 20%, var(--parchment-shadow) 80%, transparent);
  margin: 0.5rem 0;
}
.guess-rows { margin-bottom: 0.5rem; }
.guess-row {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 0; border-bottom: 1px solid var(--parchment-shadow); min-height: 34px;
}
.guess-row:last-child { border-bottom: none; }
.guess-dot {
  width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
  border: 1.5px solid var(--parchment-shadow); background: transparent;
}
.guess-dot.correct { background: var(--green); border-color: var(--green); }
.guess-dot.close   { background: var(--amber); border-color: var(--amber); }
.guess-dot.wrong   { background: var(--red);   border-color: var(--red); }
.guess-text-row { font-family: var(--fh); font-size: 18px; color: var(--ink); }
.guess-label { margin-left: auto; font-family: var(--fh); font-size: 15px; }
.guess-label.correct { color: var(--green); }
.guess-label.close   { color: var(--amber); }
.guess-label.wrong   { color: var(--ink-faint); }
.input-section { display: flex; gap: 8px; align-items: center; margin-top: 0.5rem; }
.guess-input {
  flex: 1; padding: 10px 14px;
  font-family: var(--fh); font-size: 19px;
  background: #FFFDF5;
  border: 1.5px solid var(--parchment-shadow);
  border-radius: 8px; color: var(--ink); outline: none;
  box-shadow: inset 1px 1px 3px rgba(44,26,8,0.08);
}
.guess-input:focus { border-color: var(--amber); }
.guess-input::placeholder { color: var(--ink-faint); opacity: 0.7; }
.guess-btn {
  padding: 10px 20px;
  font-family: var(--fh); font-size: 19px; font-weight: 400;
  background: var(--parchment-dark);
  border: 1.5px solid var(--ink-faint);
  border-radius: 20px; color: var(--ink); cursor: pointer;
  box-shadow: 2px 2px 0 rgba(44,26,8,0.15);
  transition: transform 0.1s, box-shadow 0.1s;
  white-space: nowrap;
}
.guess-btn:hover { background: var(--amber-bg); transform: translateY(-1px); box-shadow: 3px 3px 0 rgba(44,26,8,0.18); }
.guess-btn:active { transform: translateY(1px); box-shadow: 1px 1px 0 rgba(44,26,8,0.10); }
.error-msg { font-family: var(--fh); font-size: 13px; color: var(--red); min-height: 16px; margin-top: 4px; }
.legend { display: flex; gap: 12px; font-family: var(--fh); font-size: 13px; color: var(--ink-faint); margin-top: 6px; flex-wrap: wrap; }
.legend span { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.result-banner { border-radius: 10px; padding: 0.875rem 1rem; margin-top: 0.75rem; border: 1.5px solid var(--parchment-shadow); }
.result-banner.won { background: var(--green-bg); border-color: #7AC09A; }
.result-banner.lost { background: var(--red-bg); border-color: #E09090; }
.result-title { font-family: var(--fh); font-size: 17px; font-weight: 700; margin-bottom: 2px; }
.result-title.won { color: var(--green); }
.result-title.lost { color: var(--red); }
.result-event { font-family: var(--fh); font-size: 20px; font-weight: 700; color: var(--ink); }
.result-meta { font-family: var(--fh); font-size: 14px; color: var(--ink-faint); margin-top: 2px; }
.notes-card { background: #FFFDF5; border: 1.5px solid var(--parchment-shadow); border-radius: 10px; overflow: hidden; margin-top: 0.75rem; box-shadow: 2px 3px 0 rgba(44,26,8,0.10); }
.tabs { display: flex; border-bottom: 1.5px solid var(--parchment-shadow); overflow-x: auto; background: var(--parchment-dark); }
.tab-btn { padding: 8px 12px; font-family: var(--fh); font-size: 14px; font-weight: 700; border: none; background: transparent; cursor: pointer; color: var(--ink-faint); border-bottom: 2.5px solid transparent; white-space: nowrap; }
.tab-btn.active { color: var(--ink); border-bottom-color: var(--amber); background: #FFFDF5; }
.tab-content { padding: 0.875rem 1rem; }
.summary-text { font-family: var(--fh); font-size: 15px; line-height: 1.65; color: var(--ink); margin: 0 0 10px; }
.ap-box { padding: 8px 10px; background: #EEF2FF; border-radius: 8px; border: 1px solid #B8C8E8; }
.ap-label { font-family: var(--fh); font-size: 12px; font-weight: 700; color: var(--blue); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.8px; }
.ap-text { font-family: var(--fh); font-size: 14px; color: var(--ink); line-height: 1.5; }
.item-row { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid var(--parchment-shadow); font-family: var(--fh); font-size: 14px; color: var(--ink); line-height: 1.45; }
.item-row:last-child { border-bottom: none; }
.item-num { width: 18px; height: 18px; border-radius: 50%; background: var(--amber-bg); color: var(--amber); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px; font-family: var(--fb); }
.item-plus { color: var(--green); font-weight: 700; font-size: 15px; flex-shrink: 0; margin-top: 1px; }
.figure-row { display: flex; gap: 9px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid var(--parchment-shadow); }
.figure-row:last-child { border-bottom: none; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--parchment-dark); color: var(--ink-light); display: flex; align-items: center; justify-content: center; font-family: var(--fh); font-size: 14px; font-weight: 700; flex-shrink: 0; border: 1.5px solid var(--parchment-shadow); }
.figure-name { font-family: var(--fh); font-size: 14px; font-weight: 700; color: var(--ink); }
.figure-desc { font-family: var(--fh); font-size: 13px; color: var(--ink-faint); line-height: 1.4; margin-top: 1px; }
.exam-box { padding: 10px 12px; background: var(--amber-bg); border-radius: 8px; border: 1px solid #DDB870; }
.exam-label { font-family: var(--fh); font-size: 12px; font-weight: 700; color: var(--amber); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.8px; }
.exam-text { font-family: var(--fh); font-size: 14px; color: var(--ink); line-height: 1.6; }
.past-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
.past-title { font-family: var(--fh); font-size: 20px; font-weight: 700; color: var(--ink); }
.close-btn { font-family: var(--fh); font-size: 15px; color: var(--ink-faint); background: none; border: none; cursor: pointer; }
.past-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
.past-chip { padding: 5px 13px; font-family: var(--fh); font-size: 14px; font-weight: 700; border-radius: 20px; border: 1.5px solid var(--parchment-shadow); background: var(--scroll-bg); color: var(--ink-light); cursor: pointer; }
.past-chip.active { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }
.past-event-title { font-family: var(--fh); font-size: 22px; font-weight: 700; color: var(--ink); margin-bottom: 3px; }
.past-event-meta { font-family: var(--fh); font-size: 14px; color: var(--ink-faint); margin-bottom: 1rem; }
.hidden { display: none !important; }

/* ── MOBILE RESPONSIVE ── */
/* Hide monkey on anything under 900px wide — it's desktop only */
@media (max-width: 900px) {
  .monkey-wrap { display: none !important; }
  .scroll-wrap { margin-left: 0 !important; }
}

@media (max-width: 600px) {
  html, body {
    width: 100%;
    overflow-x: hidden;
    padding: 0;
    margin: 0;
  }

  .game-outer {
    padding: 0 !important;
    width: 100% !important;
    box-sizing: border-box;
  }

  .scroll-wrap {
    max-width: 100% !important;
    width: 100% !important;
    margin: 0 !important;
    border-radius: 0 !important;
  }

  .scroll-top, .scroll-bottom {
    border-radius: 0 !important;
    height: 24px !important;
  }

  .scroll-inner {
    padding: 16px 14px 20px !important;
    width: 100% !important;
    box-sizing: border-box !important;
  }

  .logo {
    font-size: 26px !important;
    letter-spacing: 1px !important;
  }

  .hint-text {
    font-size: 15px !important;
  }

  .hint-label {
    font-size: 14px !important;
  }

  .guess-input {
    font-size: 15px !important;
    padding: 9px 8px !important;
    min-width: 0 !important;
  }

  .guess-btn {
    font-size: 15px !important;
    padding: 9px 12px !important;
    white-space: nowrap;
  }

  .guess-row {
    gap: 6px !important;
  }

  .tab-btn {
    font-size: 12px !important;
    padding: 5px 8px !important;
  }

  .past-tab {
    right: 4px !important;
    font-size: 11px !important;
    padding: 5px 7px !important;
  }
}

</style>

let currentIdx=0,guesses=[],hintsRevealed=1,gameState="playing",activeTab="summary",showingPast=false,selectedPastIdx=0;
const MAX_GUESSES=6;
function ev(){return EVENTS[currentIdx];}
function norm(s){return s.toLowerCase().trim().replace(/[''`]/g,"").replace(/[^a-z0-9\s]/g,"").replace(/\s+/g," ");}
function scoreGuess(raw){
  const g=norm(raw),e=ev(),title=norm(e.title),accepted=e.acceptedAnswers.map(norm);
  if(g===title||accepted.includes(g))return"correct";
  const gW=g.split(" ").filter(w=>w.length>3),tW=title.split(" ").filter(w=>w.length>3);
  const shT=gW.filter(w=>tW.includes(w));
  if(shT.length>=2)return"correct";
  for(const a of accepted){const aW=a.split(" ").filter(w=>w.length>3);if(gW.filter(w=>aW.includes(w)).length>=2)return"correct";}
  const all=e.words.map(w=>w.toLowerCase());
  if(all.includes(g))return"close";
  for(const gw of gW){if(all.includes(gw))return"close";}
  if(shT.length===1)return"close";
  return"wrong";
}
function setMascot(state,anim){
  const img=document.getElementById("mascot"),bub=document.getElementById("bubble");
  img.src=SPRITES[state]||SPRITES.idle;
  bub.textContent=BUBBLES[state]||BUBBLES.idle;
  if(anim){img.classList.remove("bounce","shake");void img.offsetWidth;img.classList.add(anim);setTimeout(()=>img.classList.remove("bounce","shake"),500);}
}
function renderHints(){
  const e=ev();
  document.getElementById("hintLabel").textContent="Clue "+hintsRevealed+" of "+e.hints.length;
  document.getElementById("periodTag").textContent=e.period+" · "+e.week;
  document.getElementById("hintsArea").innerHTML=e.hints.slice(0,hintsRevealed).map((h,i)=>'<div class="hint-line"><span class="hint-num">'+(i+1)+'</span><span class="hint-text'+(i===hintsRevealed-1?" active":"")+'">'+h+'</span></div>').join("");
  document.getElementById("emptyLines").innerHTML=Array.from({length:Math.max(0,e.hints.length-hintsRevealed)}).map(()=>'<div class="hint-line"><span class="hint-num"></span><span class="hint-text empty">...</span></div>').join("");
}
function renderBoard(){
  document.getElementById("guessBoard").innerHTML=Array.from({length:MAX_GUESSES}).map((_,i)=>{
    const g=guesses[i];
    if(!g)return'<div class="guess-row"><div class="guess-dot"></div></div>';
    return'<div class="guess-row"><div class="guess-dot '+g.result+'"></div><span class="guess-text-row">'+g.text+'</span><span class="guess-label '+g.result+'">'+(g.result==="correct"?"correct":g.result==="close"?"warmer":"not related")+'</span></div>';
  }).join("");
}
function notesHTML(n){
  const tabs=[{id:"summary",label:"Overview"},{id:"causes",label:"Causes"},{id:"effects",label:"Effects"},{id:"figures",label:"Figures"},{id:"exam",label:"Exam tip"}];
  let c="";
  if(activeTab==="summary")c='<p class="summary-text">'+n.summary+'</p><div class="ap-box"><div class="ap-label">AP connection</div><div class="ap-text">'+n.apConnection+'</div></div>';
  else if(activeTab==="causes")c=n.causes.map((x,i)=>'<div class="item-row"><div class="item-num">'+(i+1)+'</div><div>'+x+'</div></div>').join("");
  else if(activeTab==="effects")c=n.effects.map(x=>'<div class="item-row"><div class="item-plus">+</div><div>'+x+'</div></div>').join("");
  else if(activeTab==="figures")c=n.figures.map(f=>'<div class="figure-row"><div class="avatar">'+f.name[0]+'</div><div><div class="figure-name">'+f.name+'</div><div class="figure-desc">'+f.desc+'</div></div></div>').join("");
  else if(activeTab==="exam")c='<div class="exam-box"><div class="exam-label">Exam tip</div><div class="exam-text">'+n.examTip+'</div></div>';
  return'<div class="notes-card"><div class="tabs">'+tabs.map(t=>'<button class="tab-btn'+(activeTab===t.id?" active":"")+ '" data-tab="'+t.id+'">'+t.label+'</button>').join("")+'</div><div class="tab-content">'+c+'</div></div>';
}
function renderResult(){
  const area=document.getElementById("resultArea");
  if(gameState==="playing"){area.classList.add("hidden");return;}
  area.classList.remove("hidden");
  const e=ev(),won=gameState==="won";
  area.innerHTML='<div class="result-banner '+(won?"won":"lost")+'"><div class="result-title '+(won?"won":"lost")+'">'+(won?"Got it in "+guesses.length+" "+(guesses.length===1?"guess":"guesses"):"The answer was")+'</div><div class="result-event">'+e.title+'</div><div class="result-meta">'+e.period+" · "+e.year+'</div></div>'+notesHTML(e.notes);
  area.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{activeTab=b.dataset.tab;renderResult();}));
}
function renderPast(){
  const area=document.getElementById("pastArea");
  if(!showingPast){area.classList.add("hidden");return;}
  area.classList.remove("hidden");
  const e=EVENTS[selectedPastIdx];
  document.getElementById("pastContent").innerHTML='<div class="past-header"><div class="past-title">Past Events</div><button class="close-btn" id="closePast">Close</button></div><div class="past-chips">'+EVENTS.map((ev,i)=>'<button class="past-chip'+(selectedPastIdx===i?" active":"")+ '" data-past="'+i+'">'+ev.week+' — '+ev.date+'</button>').join("")+'</div><div class="past-event-title">'+e.title+'</div><div class="past-event-meta">'+e.period+' · '+e.year+'</div>'+notesHTML(e.notes);
  document.getElementById("closePast").addEventListener("click",()=>{showingPast=false;document.getElementById("gameArea").classList.remove("hidden");renderPast();});
  area.querySelectorAll("[data-past]").forEach(b=>b.addEventListener("click",()=>{selectedPastIdx=parseInt(b.dataset.past);activeTab="summary";renderPast();}));
  area.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{activeTab=b.dataset.tab;renderPast();}));
}
function handleGuess(){
  const input=document.getElementById("guessInput"),err=document.getElementById("errorMsg"),trimmed=input.value.trim();
  if(!trimmed){err.textContent="Type a word or event name first";return;}
  if(guesses.length>=MAX_GUESSES||gameState!=="playing")return;
  err.textContent="";
  const result=scoreGuess(trimmed);
  guesses.push({text:trimmed,result});
  input.value="";
  hintsRevealed=Math.min(hintsRevealed+1,ev().hints.length);
  if(result==="correct"){gameState="won";setMascot("celebrate","bounce");setTimeout(()=>setMascot(ev().costume||"celebrate",null),1200);document.getElementById("inputRow").classList.add("hidden");}
  else if(guesses.length>=MAX_GUESSES){gameState="lost";setMascot("wrong","shake");document.getElementById("inputRow").classList.add("hidden");}
  else if(result==="close"){setMascot("warm","bounce");}
  else{setMascot("wrong","shake");setTimeout(()=>setMascot("thinking",null),600);}
  renderHints();renderBoard();renderResult();
}
document.getElementById("guessBtn").addEventListener("click",handleGuess);
document.getElementById("guessInput").addEventListener("keydown",e=>{if(e.key==="Enter")handleGuess();});
document.getElementById("pastBtn").addEventListener("click",()=>{showingPast=true;activeTab="summary";document.getElementById("gameArea").classList.add("hidden");renderPast();});
setMascot("idle",null);renderHints();renderBoard();
</script>

<script>
// Auto-scale the entire game to fit its container width
function scaleGame() {
  const outer = document.querySelector('.scroll-wrap') || document.querySelector('.game-outer');
  if (!outer) return;
  const containerWidth = document.documentElement.clientWidth;
  const baseWidth = 520;
  if (containerWidth < baseWidth) {
    const scale = containerWidth / baseWidth;
    document.body.style.transform = 'scale(' + scale + ')';
    document.body.style.transformOrigin = 'top left';
    document.body.style.width = (100 / scale) + '%';
    document.documentElement.style.overflowX = 'hidden';
  } else {
    document.body.style.transform = '';
    document.body.style.width = '';
  }
}
window.addEventListener('load', scaleGame);
window.addEventListener('resize', scaleGame);
</script>
